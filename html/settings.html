    <!-- Main Content -->
    <main class="main-content">
        <!-- Mobile Header Bar -->
        <div class="mobile-header">
            <div class="mobile-header__brand">
                <img src="../public/MairaLogo.png" alt="Maira Jewels" class="mobile-header__logo">
                <span class="mobile-header__title">MAIRA JEWELS</span>
            </div>
            <button class="mobile-menu-btn" id="sidebar-toggle" aria-label="Toggle Menu">â˜°</button>
        </div>

        <!-- Settings Section -->
        <section class="section active" id="section-settings">
            <div class="section__header">
                <h2>Admin Settings</h2>
            </div>

            <div class="dashboard-grid">
                <!-- Profile Management Card -->
                <div class="card">
                    <div class="card__header">
                        <h3>Profile Information</h3>
                    </div>
                    <form id="profile-form" style="padding: 1.5rem;">
                        <div class="form-group">
                            <label for="profile-name">Full Name *</label>
                            <input type="text" id="profile-name" placeholder="e.g. Admin Name" required>
                        </div>
                        <div class="form-group">
                            <label for="profile-email">Email Address *</label>
                            <input type="email" id="profile-email" placeholder="admin@example.com" required>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="profile-role">Admin Role</label>
                                <input type="text" id="profile-role" placeholder="e.g. Administrator">
                            </div>
                            <div class="form-group">
                                <label for="profile-avatar">Avatar Initial (1 Letter)</label>
                                <input type="text" id="profile-avatar" maxlength="1" placeholder="A" style="text-transform: uppercase;">
                            </div>
                        </div>
                        <div style="margin-top: 1.25rem;">
                            <button type="submit" class="btn btn--primary">Save Profile Changes</button>
                        </div>
                    </form>
                </div>

                <!-- Password Management Card -->
                <div class="card">
                    <div class="card__header">
                        <h3>Security & Password</h3>
                    </div>
                    <form id="password-form" style="padding: 1.5rem;">
                        <div class="form-group">
                            <label for="current-password">Current Password *</label>
                            <input type="password" id="current-password" placeholder="Enter current password" required>
                        </div>
                        <div class="form-group">
                            <label for="new-password">New Password *</label>
                            <input type="password" id="new-password" placeholder="Minimum 6 characters" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Confirm New Password *</label>
                            <input type="password" id="confirm-password" placeholder="Confirm new password" minlength="6" required>
                        </div>
                        <div style="margin-top: 1.25rem;">
                            <button type="submit" class="btn btn--primary">Update Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
