<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maira Jewels — FAQ Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
    <script>
        (function() {
            var token = localStorage.getItem('maira_admin_token') || localStorage.getItem('token') || localStorage.getItem('admin_token');
            var authFlag = localStorage.getItem('maira_admin_auth') === 'true';
            if (!token && !authFlag) {
                window.location.href = '../index.html';
            }
        })();
    </script>
</head>
<body class="admin-body">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
            <img src="../public/MairaLogo.png" alt="Maira Jewels" class="sidebar__logo">
            <div class="sidebar__brand-text">
                <h2>MAIRA JEWELS</h2>
                <p>Admin Panel</p>
            </div>
        </div>
        <nav class="sidebar__nav">
            <a href="dashboard.html" class="sidebar__link" data-section="dashboard">
                <span class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span> Dashboard
            </a>
            <a href="products.html" class="sidebar__link" data-section="products">
                <span class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span> Products
            </a>
            <a href="categories.html" class="sidebar__link" data-section="categories">
                <span class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 6.3 6.3a2.4 2.4 0 0 1 0 3.4L17 19"/><path d="M9.586 5.586A2 2 0 0 0 8.172 5H3v5.172a2 2 0 0 0 .586 1.414l8.293 8.293a2 2 0 0 0 2.828 0l5.172-5.172a2 2 0 0 0 0-2.828z"/><circle cx="6.5" cy="8.5" r="1.5"/></svg></span> Categories
            </a>
            <a href="orders.html" class="sidebar__link" data-section="orders">
                <span class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></span> Orders
            </a>
            <a href="customers.html" class="sidebar__link" data-section="customers">
                <span class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Customers
            </a>
            <a href="payments.html" class="sidebar__link" data-section="payments">
                <span class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></span> Payments
            </a>
            <a href="faq.html" class="sidebar__link active" data-section="faq">
                <span class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></span> FAQ Management
            </a>
            <a href="contact.html" class="sidebar__link" data-section="contact">
                <span class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span> Contact Management
            </a>
            <a href="settings.html" class="sidebar__link" data-section="settings">
                <span class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span> Settings
            </a>
        </nav>
        <div class="sidebar__footer">
            <div class="admin-user">
                <div class="admin-user__avatar" id="admin-avatar">A</div>
                <div>
                    <p class="admin-user__name" id="admin-name">Admin</p>
                    <p class="admin-user__role">Administrator</p>
                </div>
            </div>
            <button class="btn btn--logout" id="logout-btn">Log Out</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Mobile Header Bar -->
        <div class="mobile-header">
            <div class="mobile-header__brand">
                <img src="../public/MairaLogo.png" alt="Maira Jewels" class="mobile-header__logo">
                <span class="mobile-header__title">MAIRA JEWELS</span>
            </div>
            <button class="mobile-menu-btn" id="sidebar-toggle" aria-label="Toggle Menu">☰</button>
        </div>

        <!-- FAQ Management Section -->
        <section class="section active" id="section-faq">
            <div class="section__header">
                <h2>FAQ Management</h2>
                <button class="btn btn--primary" id="add-faq-btn">+ Add FAQ</button>
            </div>
            <div class="card">
                <div class="table-toolbar">
                    <input type="text" id="faq-search" class="input input--search" placeholder="Search questions, answers, categories...">
                    <select id="faq-status-filter" class="input input--select">
                        <option value="all">All Statuses</option>
                        <option value="approved">Approved</option>
                        <option value="pending">Pending Reply</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>FAQ ID</th>
                                <th>Question</th>
                                <th>Answer & Status</th>
                                <th>Category</th>
                                <th>Live On Website</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="faq-table"></tbody>
                    </table>
                </div>
                <div id="faq-pagination" class="pagination-container"></div>
            </div>
        </section>
    </main>

    <!-- FAQ Add/Edit Modal -->
    <div class="modal-overlay" id="faq-modal">
        <div class="modal">
            <div class="modal__header">
                <h3 id="faq-modal-title">Add FAQ</h3>
                <button class="modal__close" data-close="faq-modal">&times;</button>
            </div>
            <form id="faq-form" class="modal__body">
                <input type="hidden" id="faq-id">
                <div class="form-group">
                    <label for="faq-question">Question *</label>
                    <input type="text" id="faq-question" placeholder="e.g. Are your pieces waterproof?" required>
                </div>
                <div class="form-group">
                    <label for="faq-answer">Answer / Reply *</label>
                    <textarea id="faq-answer" rows="4" placeholder="Provide a helpful, refined answer for your customers..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="faq-category">Category</label>
                    <select id="faq-category">
                        <option value="Shipping & Delivery">Shipping & Delivery</option>
                        <option value="Returns & Exchanges">Returns & Exchanges</option>
                        <option value="Product Care">Product Care</option>
                        <option value="Ordering & Payment">Ordering & Payment</option>
                        <option value="Custom Jewelry">Custom Jewelry</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="faq-status">Website Approval & Visibility</label>
                    <select id="faq-status">
                        <option value="approved">Approved & Live On Website</option>
                        <option value="pending">Pending Reply / Draft</option>
                        <option value="inactive">Inactive / Hidden</option>
                    </select>
                </div>
                <div class="modal__footer">
                    <button type="button" class="btn btn--secondary" data-close="faq-modal">Cancel</button>
                    <button type="submit" class="btn btn--primary">Save FAQ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Quick Reply & Approve Modal -->
    <div class="modal-overlay" id="faq-reply-modal">
        <div class="modal">
            <div class="modal__header">
                <h3>Reply & Approve FAQ</h3>
                <button class="modal__close" data-close="faq-reply-modal">&times;</button>
            </div>
            <form id="faq-reply-form" class="modal__body">
                <input type="hidden" id="faq-reply-id">
                <div style="background: #faf8f5; border: 1px solid #ede6d8; border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 1.15rem;">
                    <label style="font-size: 0.72rem; text-transform: uppercase; color: var(--color-muted); font-weight: 700; display: block; margin-bottom: 0.3rem;">User Question</label>
                    <p id="faq-reply-question-text" style="font-weight: 600; color: var(--color-charcoal); font-size: 0.9rem; line-height: 1.35; margin: 0;"></p>
                </div>
                <div class="form-group">
                    <label for="faq-reply-answer">Your Official Reply *</label>
                    <textarea id="faq-reply-answer" rows="5" placeholder="Write your response to be published on the website..." required></textarea>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; font-size: 0.84rem;">
                        <input type="checkbox" id="faq-reply-approve-checkbox" checked style="width: auto; margin: 0;">
                        <span><strong>Approve immediately</strong> (renders live on the customer website)</span>
                    </label>
                </div>
                <div class="modal__footer">
                    <button type="button" class="btn btn--secondary" data-close="faq-reply-modal">Cancel</button>
                    <button type="submit" class="btn btn--primary">Publish Reply</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/faq.js"></script>
</body>
</html>
