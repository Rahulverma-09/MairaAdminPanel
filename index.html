<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maira Jewels — Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script>
        (function() {
            var token = localStorage.getItem('maira_admin_token') || localStorage.getItem('token') || localStorage.getItem('admin_token');
            var authFlag = localStorage.getItem('maira_admin_auth') === 'true';
            if (token || authFlag) {
                window.location.href = 'html/dashboard.html';
            }
        })();
    </script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="public/MairaLogo.png" alt="Maira Jewels" style="width: 70px; height: 70px; object-fit: contain; margin-bottom: 0.75rem;">
                <h1>MAIRA JEWELS</h1>
                <p>Admin Panel</p>
            </div>
            <form id="admin-login-form" class="login-form">
                <div class="form-group">
                    <label for="admin-email">Email Address</label>
                    <input type="email" id="admin-email" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn--primary btn--full">LOG IN TO ADMIN</button>
            </form>
            <div id="login-error" class="login-error" style="display:none;"></div>
        </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
